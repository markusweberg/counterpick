<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counterpick</title>
    <!--
      The face is served from the app itself (public/fonts, declared in styles.css), not
      from Google. This runs beside the game on a machine that may be offline or behind a
      captive network, and a CDN link that fails silently drops the whole UI to a
      fallback nobody chose.
    -->
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
